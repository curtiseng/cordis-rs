# 基础组合。每一行是一项能力，跟 dsh 的 cordis.yml 同形。
# 换实现：关掉旧行再 insert 新行（见 cordis.smoke.yml / cordis.creation.yml）。

- id: fs-sandbox
  name: fs-sandbox
  config:
    root: .

- id: tool-fs
  name: tool-fs

- id: bash-sandbox
  name: bash-sandbox
  config:
    root: .

- id: tool-bash
  name: tool-bash

- id: tool-web-fetch
  name: tool-web-fetch

- id: system-prompt
  name: system-prompt
  config:
    agents_file: AGENTS.md

- id: agent-loop
  name: agent-loop
  config:
    max_rounds: 12

- id: doc
  name: doc
  config:
    path: assets/sample.md

- id: read-doc
  name: read-doc

- id: outline
  name: wasm
  config:
    guest: outline
    grant: [markdown]
    role: 抽标题大纲

- id: cite
  name: script
  config:
    file: plugins/cite.js
    grant: [markdown]
    role: 按关键词引用原文

- id: llm
  name: deepseek

- id: ui
  name: web
  config:
    port: 8787
