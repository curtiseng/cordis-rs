[package]
name = "spatiotemporal-agent"
version = "0.5.0"
description = "一切都是插件：读一篇 Markdown、接 LLM、在浏览器里对话"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "spatiotemporal-agent"
path = "src/main.rs"

[dependencies]
spatiotemporal.workspace = true
spatiotemporal-wasm = { path = "../crates/spatiotemporal-wasm" }
spatiotemporal-script = { path = "../crates/spatiotemporal-script" }
spatiotemporal-process = { path = "../crates/spatiotemporal-process" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
notify = "8.2.0"
tiny_http = "0.12.0"
ureq = { version = "2.12.1", features = ["json"] }
