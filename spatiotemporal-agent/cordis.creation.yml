# 创造模式：叠在标准组合之上。
# 启动：cargo run -p spatiotemporal-agent -- --creation

- id: ui
  config:
    port: 8787
    creation: true

- insert:
    - id: approval-policy
      name: approval-policy
      config:
        require: [script, wasm, process, patch]
        max_queue: 10
    - id: patch-watcher
      name: patch-watcher
      config:
        path: cordis.patch.yml
    - id: creation
      name: creation-tools
      config:
        enabled: true
