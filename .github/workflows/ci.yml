name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 内核：一份依赖极少、不碰 IO 的库，外加两个示例。
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --example swap_provider
      - run: cargo run --example watch_config

  # 全 workspace MSRV 1.94。这个 job 钉在最低版本上编内核，防止 lockfile 漂移。
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p spatiotemporal

  # wasm 适配器：测试要真的 guest 产物。
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-guests.sh
        working-directory: crates/spatiotemporal-wasm
      - run: cargo clippy -p spatiotemporal-wasm --all-targets -- -D warnings
      - run: cargo test -p spatiotemporal-wasm

  # 脚本适配器：guest 就是字符串，不用预编译产物。
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p spatiotemporal-script --all-targets -- -D warnings
      - run: cargo test -p spatiotemporal-script

  # 子进程适配器：测试要真的 guest 可执行文件。
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-guests.sh
        working-directory: crates/spatiotemporal-process
      - run: cargo clippy -p spatiotemporal-process --all-targets -- -D warnings
      - run: cargo test -p spatiotemporal-process

  # agent：编 outline.wasm，按 cordis.yml 装配，--smoke 叠一层
  # patch 把 LLM 换成脚本 echo、界面换成 probe。不调真实 LLM。
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: ./scripts/build-guests.sh
        working-directory: spatiotemporal-agent
      - run: cargo clippy -p spatiotemporal-agent --all-targets -- -D warnings
      - run: cargo run -p spatiotemporal-agent -- --smoke
