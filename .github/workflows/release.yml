name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: spatiotemporal-agent
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: spatiotemporal-agent
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: spatiotemporal-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: spatiotemporal-agent.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation targets
        run: |
          rustup target add wasm32-wasip2
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            rustup target add x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spatiotemporal-agent

      - name: Build wasm guest
        run: ./scripts/build-guests.sh
        working-directory: spatiotemporal-agent

      - name: Build release binary
        run: cargo build -p spatiotemporal-agent --release --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: '../target/${{ matrix.target }}/release/${{ matrix.bin }} --smoke'
        working-directory: spatiotemporal-agent

      - name: Package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="../target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$BIN" 2>/dev/null || true
          ./scripts/package-release.sh "$VERSION" "${{ matrix.target }}" "$BIN"
        working-directory: spatiotemporal-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatiotemporal-agent-${{ matrix.target }}
          path: spatiotemporal-agent/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
